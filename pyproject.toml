[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "amfora"
version = "1.0.3"
description = "Automated Macroscopic Fabric and Orientation Analysis for ceramic sherds"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alec Iacobucci", email = "aleciaco@uw.edu" },
]
maintainers = [
    { name = "Alec Iacobucci", email = "aleciaco@uw.edu" },
]
keywords = [
    "ceramic analysis",
    "computer vision",
    "archaeological image processing",
    "petrography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.19.0",
    "pandas>=1.3.0",
    "matplotlib>=3.3.0",
    "scipy>=1.7.0",
    "scikit-image>=0.18.0",
    "pillow>=8.0.0",
    "seaborn>=0.11",
    "scikit-learn>=1.0",
    "plotly>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "amfora[test,docs]",
    "ruff>=0.4",
]
docs = [
    # Pinned to v1 because our docs use the Sphinx-based _config.yml / _toc.yml
    # layout; jupyter-book v2 switched to a mystmd-based system with a
    # different config schema.  Migration to v2 is a future task.
    "jupyter-book>=1.0,<2",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://github.com/aleciaco/AMFOrA_public"
Source = "https://github.com/aleciaco/AMFOrA_public"
Issues = "https://github.com/aleciaco/AMFOrA_public/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/amfora"]

[tool.hatch.build.targets.sdist]
include = [
    "src/amfora",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "docs/conf.py",        # auto-generated by jupyter-book from _config.yml
    "docs/_build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module-level import not at top — needed for runtime-guarded imports
    "E712",  # `== True/False` comparisons (occasional intentional pattern)
    "E741",  # ambiguous variable name (some legacy single-letter math vars)
    "F403",  # `from X import *` — intentional in amfora/__init__.py for re-exports
    "F841",  # unused locals — noisy in plotting/exploration code
    "B007",  # unused loop control variable — noisy in numpy iteration
    "B028",  # missing explicit `stacklevel` in warnings.warn — cosmetic
    "B905",  # `zip()` without explicit `strict=` — Python 3.10+ best-practice, low value
]

[tool.ruff.format]
quote-style = "double"
