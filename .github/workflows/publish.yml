# GitHub Actions workflow: build a wheel + sdist and publish to PyPI
# when a version tag is pushed (e.g. `git tag v1.0.0 && git push --tags`).
#
# Setup required before the first run:
#   1. Create an account at https://pypi.org/account/register/
#   2. Create an account at https://test.pypi.org/account/register/ (testing)
#   3. On PyPI, register the project name "amfora" — either by manually
#      uploading once, or by configuring "trusted publishing" (PyPI's
#      OIDC-based publishing that doesn't need an API token):
#        https://docs.pypi.org/trusted-publishers/
#      Under PyPI > Account > Publishing > Add a new pending publisher,
#      set: repo = aleciaco/AMFOrA_public, workflow = publish.yml,
#      environment = pypi
#   4. In this repo: Settings > Environments > New environment > "pypi"
#   5. Push a tag matching the v*.*.* pattern.
#
# To test the workflow without publishing to real PyPI, push a tag with
# a "-test" suffix (e.g. v0.1.0-test) and it'll go to TestPyPI instead.

name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        # `python -m build` produces both an sdist (.tar.gz source archive)
        # and a wheel (.whl binary distribution) in the dist/ folder.
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (test tags only)
    needs: build
    if: contains(github.ref, '-test') || contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/amfora
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI (real release tags)
    needs: build
    if: ${{ !contains(github.ref, '-test') && !contains(github.ref, '-rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/amfora
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
